name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.9"
      - name: Install dependencies
        run: |
          uv pip install --system -e .[test,dev,docs]
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12"]
        dask-enabled: [true, false]
    name: test (py${{ matrix.python-version }}, dask=${{ matrix.dask-enabled }})
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          if [ "${{ matrix.dask-enabled }}" = "true" ]; then
            uv pip install --system -e .[test,dev,docs,dask]
          else
            uv pip install --system -e .[test,dev,docs]
          fi
      - name: Test with pytest
        run: |
          pytest --cov=src/monet_stats --cov-report=xml --cov-report=term-missing --cov-fail-under=60
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: true

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install dependencies
        run: |
          uv pip install --system -e .[test,dev,docs,dask]
      - name: Install build dependencies
        run: |
          uv pip install --system build twine
      - name: Build package
        run: uv build
      - name: Check package
        run: twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install dependencies
        run: |
          uv pip install --system -e .[test,dev,docs,dask]
      - name: Build documentation
        run: mkdocs build
      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: site/
