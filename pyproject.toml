[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet-stats"
version = "0.1.0"
description = "A comprehensive statistics and utility library for atmospheric sciences"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MONET Development Team"}
]
maintainers = [
    {name = "MONET Development Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Mathematics"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=2.0.0; python_version >= '3.9'",
    "pandas>=1.3.0,<2.0.0; python_version == '3.8'",
    "scipy>=1.7.0",
    "xarray>=2023.5.0; python_version >= '3.9'",
    "xarray>=2022.3.0; python_version == '3.8'",
    "matplotlib>=3.4.0"
]

[project.optional-dependencies]
dask = [
    "dask",
    "distributed"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "hypothesis>=6.0.0",
    "pytest-benchmark>=4.0.0",
    "coverage>=6.0.0",
    "psutil"
]
dev = [
    "pre-commit>=2.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-benchmark>=4.0.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocstrings[python]>=0.20.0",
    "mknotebooks>=0.7.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions"
]

[project.urls]
Homepage = "https://github.com/noaa-oar-arl/monet-stats"
Repository = "https://github.com/noaa-oar-arl/monet-stats"
Documentation = "https://monet-stats.readthedocs.io/"
Changelog = "https://github.com/noaa-oar-arl/monet-stats/releases"
"Issue Tracker" = "https://github.com/noaa-oar-arl/monet-stats/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = [
    "D100", "D104", "D203", "D213",
    "N802", "N803", "N806", # Allow capitalized metric names/arguments
    "D200", "D400", "D415", # Docstring formatting nits
    "D103", # Allow missing docstrings in tests/private functions
    "D205", "D401", "D102", # More docstring nits
    "N811", # Allow importing capitalized metrics as non-capitalized aliases
]

[tool.ruff.lint.isort]
known-first-party = ["monet_stats"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src/monet_stats"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
