site_name: MONET Stats
site_description: Model evaluation and verification metrics for atmospheric science
site_url: https://noaa-oar-arl.github.io/monet-stats/
theme:
  name: material
  language: en
  icon:
    logo: material/weather-cloudy
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
repo_url: https://github.com/noaa-oar-arl/monet-stats
repo_name: noaa-oar-arl/monet-stats
edit_uri: edit/main/docs/
copyright: NOAA Air Resources Laboratory
docs_dir: docs

nav:
  - Home: index.md
  - Start Here:
    - Installation: installation.md
    - Getting Started: getting-started.md
  - Guides:
    - System Integration: system-integration.md
    - Workflows:
      - Climate Data Analysis: workflows/climate-data-analysis.md
    - Notebooks:
      - Notebooks Overview: notebooks/README.md
    - Contributing: contributing.md
    - FAQ: faq.md
  - API:
    - Overview: api/overview.md
    - Xarray Accessor: api/accessor.md
    - Analysis: api/analysis.md
    - Benchmarks: api/benchmarks.md
    - Contingency Metrics: api/contingency-metrics.md
    - Correlation Metrics: api/correlation-metrics.md
    - Data Processing: api/data-processing.md
    - Efficiency Metrics: api/efficiency-metrics.md
    - Error Metrics: api/error-metrics.md
    - Interfaces: api/interfaces.md
    - Performance: api/performance.md
    - Plugin System: api/plugin-system.md
    - Relative Metrics: api/relative-metrics.md
    - Spatial & Ensemble Metrics: api/spatial-ensemble-metrics.md
    - Spatial Skill Metrics: api/spatial-skill-metrics.md
    - Track Metrics: api/track-metrics.md
    - Utility Functions: api/utils-stats.md
    - Distributional Metrics: api/distribution-metrics.md
    - Temporal Metrics: api/temporal-metrics.md
    - Uncertainty Metrics: api/uncertainty.md
  - Methods:
    - Mathematical Overview: math/overview.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  # mknotebooks remains disabled because the plugin causes build warnings and notebook JSON errors.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/noaa-oar-arl/monet-stats
      name: MONET Stats on GitHub
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
